name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # pyproject claims >=3.10,<3.15. Testing one version proved a fifth of
      # that, so the matrix covers what the metadata promises. MediaPipe's
      # wheels are py3-none, so the range is torch's and numpy's.
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    name: tests on ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: OpenCV needs libGL on a headless runner
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -e '.[dev]'
      # The landmarker weights and the HaGRID subset are deliberately not in
      # the repo, and there is no camera here, so the 16 tests that need them
      # skip. Verified on a clean clone of v2: 710 pass, 16 skip.
      - run: pytest -q
