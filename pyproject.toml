[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ika"
version = "0.1.0"
description = "Control a computer with bare hands"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Subomi Olagoke" }]

dependencies = [
    # 1.0.1 crashes on Apple Silicon: TensorsToDetectionsCalculator::Open
    # aborts inside DrishtiMetalHelper with "Service is unavailable", in both
    # IMAGE and VIDEO mode and even with the CPU delegate forced. 0.10.35 is
    # the newest release that works here, so this ceiling is deliberate.
    "mediapipe>=0.10.30,<1.0",
    "torch>=2.2",
    "opencv-python>=4.8",
    "numpy>=1.26",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ika = "ika.cli:main"

[tool.setuptools.packages.find]
include = ["ika*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
